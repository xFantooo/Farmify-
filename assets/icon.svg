<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Shield -->
  <path d="M 256 80 L 360 130 L 360 250 Q 360 350 256 420 Q 152 350 152 250 L 152 130 Z" 
        fill="#1E293B" opacity="0.3"/>
  <path d="M 256 100 L 340 140 L 340 240 Q 340 320 256 380 Q 172 320 172 240 L 172 140 Z" 
        fill="#F8FAFC" opacity="0.9"/>
  
  <!-- Crossed swords -->
  <g fill="url(#sword)">
    <!-- Left sword -->
    <rect x="210" y="160" width="20" height="180" rx="3" transform="rotate(-25 220 250)"/>
    <polygon points="210,165 220,150 230,165" transform="rotate(-25 220 250)"/>
    <rect x="205" y="310" width="30" height="15" rx="2" transform="rotate(-25 220 250)"/>
    
    <!-- Right sword -->
    <rect x="282" y="160" width="20" height="180" rx="3" transform="rotate(25 292 250)"/>
    <polygon points="282,165 292,150 302,165" transform="rotate(25 292 250)"/>
    <rect x="277" y="310" width="30" height="15" rx="2" transform="rotate(25 292 250)"/>
  </g>
  
  <!-- Bot indicator -->
  <circle cx="256" cy="380" r="28" fill="#10B981"/>
  <circle cx="256" cy="380" r="20" fill="#F8FAFC"/>
  <circle cx="256" cy="380" r="12" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
